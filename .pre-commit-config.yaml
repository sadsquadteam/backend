repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    -   id: trailing-whitespace # حذف فاصله‌های اضافی آخر خطوط
    -   id: end-of-file-fixer   # اطمینان از وجود یک خط خالی در انتهای فایل
    -   id: check-yaml          # بررسی صحت فایل‌های yaml
    -   id: check-added-large-files # جلوگیری از کامیت فایل‌های خیلی حجیم

-   repo: https://github.com/psf/black
    rev: 24.2.0
    hooks:
    -   id: black
        language_version: python3

-   repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
    -   id: isort

-   repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
    -   id: flake8
        args: ['--max-line-length=88']
