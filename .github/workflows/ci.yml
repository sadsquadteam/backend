# Name for your workflow, displayed in the "Actions" tab of your GitHub repo
name: Django CI Pipeline

# Controls when the workflow will run
on:
  # Triggers on push events for the "main" branch
  push:
    branches: [ "main" ]
  # Triggers on pull request events targeting the "main" branch
  pull_request:
    branches: [ "main" ]

# A workflow is made up of one or more jobs
jobs:
  # This workflow contains a single job called "build-and-test"
  build-and-test:
    # The type of virtual machine the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks to be executed
    steps:
      # Step 1: Checks-out your repository's code so the job can access it
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Sets up the Python environment
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Use the same Python version as your development environment
          cache: 'pip' # Caches dependencies to speed up subsequent builds

      # Step 3: Install project dependencies from requirements.txt
      - name: Install Dependencies
        run: pip install -r requirements.txt

      # Step 4: Run Django's built-in tests
      # This command discovers and runs tests in your Django apps.
      # A new project will have default tests that pass.
      - name: Run Tests
        run: python manage.py test